<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel da Prefeitura — protótipo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F172A;--ink2:#334155;--muted:#5B6576;--line:#E4E7EC;--line2:#EEF0F3;--bg:#F6F7F9;--card:#fff;
  --brand:#0E6E6E;--brand-d:#0A5555;--brand-l:#E6F2F2;--brand-b:#BBDADA;
  --good:#1D7A55;--good-bg:#E3F2EA;--warn:#8A6100;--warn-bg:#FBF0D3;--warn-m:#C99A12;--crit:#B4400F;--crit-bg:#FCE7DC;
  --avg:#7C8696;--best:#2F6FDE;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:244px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:20px 20px 16px}
.logo i{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal}
.logo b{display:block;font-size:15px;line-height:1.2}
.logo span{font-size:12px;color:var(--muted)}
.side nav{display:flex;flex-direction:column;gap:2px;padding:8px 12px}
.side nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:9px;padding:10px 12px;min-height:42px;font-size:14px;font-weight:500;color:var(--ink2);text-align:left}
.side nav button:hover{background:var(--bg)}
.side nav button.on{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.side .grow{flex:1}
.side .foot{padding:16px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:12px}
.city{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.city b{font-size:18px;line-height:1.2}
.city span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 34px 8px 12px;min-height:40px;font-size:14px;font-weight:600}
.sel:after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;min-height:40px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:#CBD2DB}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.avatar{width:38px;height:38px;border-radius:999px;background:var(--brand);color:#fff;border:0;font-weight:600;font-size:13px;flex:none}
.content{max-width:1180px;width:100%;margin:0 auto;padding:24px 28px 56px}
.bnav{display:none}

/* blocks */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.ph h1{font-size:24px;line-height:1.2;margin:0}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:18px 20px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0}
.ch h2{font-size:15px;margin:0;font-weight:600}
.ch span{font-size:12px;color:var(--muted)}
.g{display:grid;gap:16px}
.g>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.mt{margin-top:16px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .s{font-size:13px}
.up{color:var(--good)}.down{color:var(--crit)}.flat{color:var(--muted)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-crit{background:var(--crit-bg);color:var(--crit)}.p-neu{background:#EEF0F3;color:var(--ink2)}
.tag{font-size:12px;color:var(--muted);font-weight:500}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:30px;padding:0 8px;border-radius:8px;font-weight:700;font-size:15px}
.ai{background:linear-gradient(0deg,#fff,#fff);border:1px solid var(--brand-b);border-radius:14px;padding:18px 20px;position:relative}
.ai .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--brand-d);text-transform:uppercase;letter-spacing:.05em}
.ai p{margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--ink)}
.ai small{display:block;margin-top:10px;font-size:12px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:16px}
.meta b{color:var(--ink2);font-weight:600}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 20px;border:0;border-top:1px solid var(--line2);background:transparent;text-align:left;width:100%;min-height:56px}
.row:first-child{border-top:0}
.row:hover{background:#FAFBFC}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12px;color:var(--muted)}
.row .dl{font-size:13px;font-weight:600;min-width:52px;text-align:right}
.row .vs{font-size:12px;color:var(--muted);min-width:96px;text-align:right}
.row .sp{flex:none}
.cardlist .row{padding-left:20px;padding-right:20px}

/* area bars */
.bars{display:flex;flex-direction:column;gap:2px;padding:10px 12px 14px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 44px 52px;align-items:center;gap:12px;border:0;background:transparent;border-radius:8px;padding:7px 8px;text-align:left;width:100%}
.bar:hover{background:#FAFBFC}
.bar .n{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:10px;background:var(--line2);border-radius:999px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.track u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.bar .v{font-weight:700;font-size:14px;text-align:right}
.bar .d{font-size:12px;font-weight:600;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:0 20px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.legend i.tick{width:2px;height:12px;background:var(--ink);opacity:.55}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--avg) 0 4px,transparent 4px 7px)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chartwrap{padding:8px 12px 6px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;min-height:40px;padding:8px 12px 8px 36px;font-size:14px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:0 -2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:#EEF0F3;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;min-height:34px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.seg i{width:8px;height:8px;border-radius:999px;display:inline-block}
.active{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-2px 0 12px;font-size:13px;color:var(--muted)}
.rm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 6px 4px 12px;min-height:32px;font-size:13px;font-weight:600;color:var(--ink2)}
.rm span{width:20px;height:20px;border-radius:999px;background:#EEF0F3;display:inline-flex;align-items:center;justify-content:center}
.sel.full select{width:100%}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;min-height:34px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.thead{display:flex;gap:14px;padding:10px 20px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.thead .nm{flex:1}

/* map */
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:16px 20px}
.tile{border-radius:10px;padding:12px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;border:1.5px solid;text-align:left}
.tile b{font-size:13px}
.tile span{font-size:22px;font-weight:700}
.span2{grid-column:span 2}

/* comparativo */
.cmp{display:grid;grid-template-columns:minmax(120px,200px) 56px 56px minmax(0,1fr) 72px;gap:12px;align-items:center;padding:11px 20px;border-top:1px solid var(--line2);font-size:14px}
.cmp:first-child{border-top:0}
.cmp.h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.div{position:relative;height:12px}
.div:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#CBD2DB}
.div i{position:absolute;top:0;bottom:0;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mapwrap{padding:12px 12px 0}
.citymap{width:100%;height:auto;display:block;border-radius:10px}
.citymap .reg{cursor:pointer;outline:none}
.citymap .reg polygon{stroke:#fff;stroke-width:2.5;stroke-linejoin:round;transition:filter .12s}
.citymap .reg:hover polygon{filter:brightness(.96)}
.citymap .reg:focus-visible polygon{stroke:var(--brand);stroke-width:4}
.citymap .reg.on polygon{stroke:var(--ink);stroke-width:3.5}
.fld{display:flex;flex-direction:column;gap:6px;border:0;margin:0;padding:0;min-width:0}
.fld label,.fld legend{font-size:13px;font-weight:600;color:var(--ink2);padding:0;margin-bottom:6px}
.fld label{margin-bottom:0}
.fld input,.fld textarea{width:100%;border:1px solid #CBD2DB;background:#fff;border-radius:9px;min-height:42px;padding:9px 12px;font-size:15px}
.fld textarea{resize:vertical;min-height:84px}
.fld [aria-invalid=true]{border-color:var(--crit)}
.fld select:disabled{background:#F6F7F9;color:var(--muted)}
.opt{font-weight:400;color:var(--muted)}
.ferr{font-size:13px;color:var(--crit);font-weight:500}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{background:var(--brand-l);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2);display:block}
.hint .score{height:24px;min-width:38px;font-size:13px;margin:0 2px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1px solid #CBD2DB;background:#fff;border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:600;color:var(--ink2)}
.pick.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pick.ghost{border-style:dashed;color:var(--brand)}
.sheet .ft{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:flex-end;gap:10px;margin-top:auto}
@media (max-width:860px){.frow{grid-template-columns:1fr}.sheet .ft .btn{flex:1}}
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.ghd{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,160px) 104px 46px 22px;gap:14px;align-items:center;width:100%;border:0;background:#fff;padding:14px 20px;text-align:left;min-height:64px}
.ghd:hover{background:#FAFBFC}
.ghd b{display:block;font-size:15px}
.ghd .c{font-size:12px;color:var(--muted)}
.ghd .vs{font-size:12px;text-align:right}
.ghd .chev{color:var(--muted);transition:transform .15s;display:flex}
.grp.open .ghd .chev{transform:rotate(180deg)}
.grp .rows{background:#FBFCFD;border-top:1px solid var(--line2)}
.grp .row{padding-left:36px}
.gtools{display:flex;justify-content:flex-end;gap:4px;margin:-4px 0 8px}
.gtools .btn{border:0;background:transparent;color:var(--brand);min-height:32px;padding:4px 8px;font-size:13px}
.apv{display:flex;flex-direction:column;gap:6px;padding:14px 20px 8px}
.apr{display:grid;grid-template-columns:28px minmax(90px,140px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;min-height:26px}
.apr .rk{color:var(--muted);text-align:right}
.apr.me{font-weight:700}
.apr .tr{position:relative;height:16px;background:var(--line2);border-radius:5px}
.apr .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#A5ADBA}
.apr.me .tr i{background:var(--brand)}
.apr .tr em{position:absolute;top:-3px;bottom:-3px;background:rgba(14,110,110,.18);border:1px dashed var(--brand);border-radius:4px}
.apr .tr u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.6}
.apr .v{text-align:right}
.gap{height:10px;border-left:2px dotted #CBD2DB;margin-left:41px}
.sechd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:32px 0 14px}
.sechd h2{font-size:19px;margin:0}
.restr{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);background:#EEF0F3;border-radius:999px;padding:4px 10px}
@media (max-width:860px){.ghd{grid-template-columns:minmax(0,1fr) 46px 22px;padding:14px 16px}.ghd .mb,.ghd .vs{display:none}.grp .row{padding-left:24px}.apr{grid-template-columns:24px minmax(70px,96px) minmax(0,1fr) 50px;gap:8px;padding:0}.apv{padding:12px 14px 6px}}
.locked{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;background:#FAFBFC;border:1px dashed #CBD2DB;border-radius:14px}
.locked svg{flex:none;color:var(--muted);margin-top:2px}
.locked b{display:block}
.locked p{margin:4px 0 0;font-size:14px;color:var(--muted)}

/* actions */
.act{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;padding:16px 20px;border-top:1px solid var(--line2)}
.act:first-child{border-top:0}
.act .i{flex:999 1 280px;min-width:0}
.act .i b{display:block}
.act .i span{font-size:13px;color:var(--muted)}
.act .ba{flex:1 1 220px;display:flex;align-items:center;gap:14px;justify-content:flex-end}
.act .ba div{text-align:center}
.act .ba small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.act .ba strong{font-size:18px}

/* empty */
.empty{text-align:center;padding:56px 24px}
.empty .ic{width:52px;height:52px;border-radius:14px;background:var(--brand-l);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.empty h2{font-size:18px;margin:0 0 6px}
.empty p{margin:0 auto 16px;max-width:440px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:#fff;width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:-12px 0 32px rgba(15,23,42,.12);display:flex;flex-direction:column}
.sheet .hd{position:sticky;top:0;background:#fff;z-index:1;display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.sheet .hd .t{flex:1;min-width:0}
.sheet .hd b{display:block;font-size:17px;line-height:1.3}
.x{border:0;background:var(--bg);border-radius:9px;width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center}
.sheet .bd{padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:18px}
.sheet h3{font-size:14px;margin:0 0 8px}
.quote{margin:0;padding:10px 12px;border-left:3px solid var(--brand-b);background:#FAFBFC;border-radius:0 8px 8px 0;font-size:14px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(15,23,42,.2)}
.report{max-width:620px;margin:auto;background:#fff;border-radius:14px;width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto}
.scrim.center{align-items:center;justify-content:center}
.demo{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:999px;white-space:nowrap}

/* ===== responsive ===== */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{display:none}
  .top .in{padding:10px 16px;gap:8px}
  .city b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .sel select{max-width:118px;padding-right:28px}
  .top .sel:after{right:11px}
  .top .btn{padding:8px 10px}
  .avatar{width:36px;height:36px}
  .content{padding:16px 16px 96px}
  .g2{grid-template-columns:1fr}
  .g4{gap:10px}
  .kpi{padding:12px 14px}
  .kpi .v{font-size:23px}
  .ph h1{font-size:21px}
  .hide-m{display:none!important}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{border:0;background:transparent;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
  .bnav button.on{color:var(--brand)}
  .row{padding:12px 16px;gap:10px}
  .row .vs,.row .sp{display:none}
  .thead{display:none}
  .bar{grid-template-columns:minmax(0,1fr) 40px 46px;grid-template-areas:"n v d" "t t t";row-gap:6px;padding:8px}
  .bar .n{grid-area:n}.bar .track{grid-area:t}.bar .v{grid-area:v}.bar .d{grid-area:d}
  .map{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px}
  .cmp{grid-template-columns:minmax(0,1fr) 44px 44px 56px;padding:11px 16px}
  .cmp .div{display:none}
  .sheet{width:100%;height:auto;max-height:92%;margin-top:auto;border-radius:16px 16px 0 0}

/* ---------- utilidades ---------- */
function low(t){return t.charAt(0).toLowerCase()+t.slice(1);}
function f1(v){return v==null?'—':v.toFixed(1).replace('.',',');}

function mean(a){a=a.filter(function(x){return x!=null;});return a.length?a.reduce(function(p,c){return p+c;},0)/a.length:null;}
function prevIdx(i){for(var j=i-1;j>=0;j--)if(!MISSING[j])return j;return null;}
function lastWithData(i){for(var j=i;j>=0;j--)if(!MISSING[j])return j;return LAST;}

function scoreBox(v){var L=LVL[level(v)];return '<span class="score tnum" style="background:'+L.bg+';color:'+(level(v)==='warn'?'#8A6100':L.col)+'">'+f1(v)+'</span>';}
function delta(d,suffix){

}

/* ---------- gráficos ---------- */
function lineChart(series,labels,label,dom,unit){
  var nar=window.innerWidth<600,W=nar?360:640,H=nar?200:220,L=nar?30:34,R=nar?20:14,T=14,B=30,all=[];
  series.forEach(function(s){s.v.forEach(function(x){if(x!=null)all.push(x);});});
  var lo=Math.max(0,Math.floor(Math.min.apply(null,all)-0.5)),hi=Math.min(10,Math.ceil(Math.max.apply(null,all)+0.5));
  if(hi-lo<2)hi=lo+2;
  if(dom){lo=dom[0];hi=dom[1];}
  var n=labels.length,X=function(i){return L+(W-L-R)*i/(n-1);},Y=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo));};
  var g='',st=dom?(hi-lo)/4:(hi-lo)>5?2:1;
  for(var y=lo;y<=hi;y+=st){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(y)+'" y2="'+Y(y)+'" stroke="#EEF0F3"/><text x="'+(L-8)+'" y="'+(Y(y)+4)+'" text-anchor="end" font-size="11" fill="#5B6576">'+y+(unit||'')+'</text>';}
  var xl='';labels.forEach(function(l,i){var every=nar?3:2;if(n<=7||(n-1-i)%every===0)xl+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="#5B6576">'+l+'</text>';});
  var gaps='';series[0].v.forEach(function(v,i){if(v==null&&i<n-1&&i>0)gaps+='<rect x="'+(X(i)-(nar?12:10))+'" y="'+T+'" width="'+(nar?24:20)+'" height="'+(H-T-B)+'" fill="#F6F7F9"/><text x="'+X(i)+'" y="'+(T+12)+'" text-anchor="middle" font-size="10" fill="#5B6576">sem</text><text x="'+X(i)+'" y="'+(T+24)+'" text-anchor="middle" font-size="10" fill="#5B6576">dados</text>';});
  var paths='';
  series.forEach(function(s){
    var d='',pen=false;
    s.v.forEach(function(v,i){if(v==null){pen=false;return;}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true;});
    paths+='<path d="'+d+'" fill="none" stroke="'+s.c+'" stroke-width="'+(s.w||2)+'" '+(s.dash?'stroke-dasharray="5 4"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
    if(s.dots){s.v.forEach(function(v,i){if(v!=null)paths+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(i===s.hl?4.5:2.5)+'" fill="'+(i===s.hl?s.c:'#fff')+'" stroke="'+s.c+'" stroke-width="1.6"/>';});}
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+gaps+g+xl+paths+'</svg>';
}
function spark(vals,c){
  var W=84,H=26,v=vals.filter(function(x){return x!=null;}),lo=Math.min.apply(null,v)-0.2,hi=Math.max.apply(null,v)+0.2,n=vals.length,d='',pen=false;
  vals.forEach(function(x,i){if(x==null){pen=false;return;}d+=(pen?'L':'M')+(2+(W-4)*i/(n-1)).toFixed(1)+' '+(2+(H-4)*(1-(x-lo)/(hi-lo))).toFixed(1);pen=true;});
  return '<svg class="sp" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/></svg>';

function newForm(o){o=o||{};return{t:'',area:o.area||'',svc:o.svc||'',regs:o.regs||[],st:'Planejada',ini:'',fim:'',resp:'',desc:'',err:{}};}

   '<div class="bd">'+
    '<div class="fld"><label for="f-t">Nome da ação</label><input id="f-t" data-f="t" type="text" placeholder="Ex.: Mutirão de tapa-buraco" value="'+esc(F.t)+'"'+inv('t')+'>'+err('t')+'</div>'+

function acoes(){

    var done=a.to!=null;
    return '<div class="act"><div class="i"><b>'+esc(a.t)+(a.isNew?' <span class="pill p-neu" style="margin-left:6px">Nova</span>':'')+'</b><span>'+AREA_NAME[a.a]+' · '+a.r+'</span><div style="margin-top:6px"><span class="pill '+st[a.st]+'">'+a.st+'</span></div></div><div class="ba"><div><small>Antes</small><strong class="tnum">'+f1(a.from)+'</strong></div><span class="flat" aria-hidden="true">→</span><div><small>Depois</small><strong class="tnum">'+(done?f1(a.to):'—')+'</strong></div><div style="text-align:left;min-width:120px;font-size:13px;font-weight:600">'+(done?'<span class="up">▲ '+f1(a.to-a.from)+' na percepção</span>':'<span class="flat">Aguardando próxima pesquisa</span>')+'</div></div></div>';
  }).join('');
  return '<div class="ph"><div><h1>Ações e impacto</h1><p>Cada ação é medida nas pesquisas seguintes</p></div><button type="button" class="btn pri" data-act="newaction">Registrar ação</button></div>'+

   '<div class="card mt">'+rows+'</div>';
}

  var regs=REGIONS.map(function(r,k){return{n:r,v:r1(Math.max(0,Math.min(10,v+REG_OFF[k]+Math.sin(k*1.7+s.id.length)*0.5)))};}).sort(function(a,b){return a.v-b.v;}).slice(0,3);

   '<div class="bd">'+

    '<div class="stats"><div class="stat"><small>Média das capitais</small><b class="tnum">'+f1(s.avg[i])+'</b></div><div class="stat"><small>Melhor capital</small><b class="tnum">'+f1(s.best)+'</b></div><div class="stat"><small>Posição</small><b class="tnum">'+rankOf(v,s.avg[i])+'º</b></div></div>'+
    '<div><h3>Evolução em 12 meses</h3>'+lineChart([{v:s.avg.slice(0,12),c:'#7C8696',dash:true,w:1.6},{v:s.hist.slice(0,12),c:'#0E6E6E',w:2.4,dots:true,hl:Math.min(i,11)}],MONTHS.slice(0,12),'Evolução de '+s.nome)+'<div class="legend" style="padding:6px 0 0"><span><i style="background:#0E6E6E"></i>Cidade</span><span><i class="dash"></i>Média das capitais</span></div></div>'+
    '<div><h3>Regiões com pior avaliação</h3><div class="rows" style="border:1px solid var(--line);border-radius:10px">'+regs.map(function(r){return '<div class="row" style="cursor:default;min-height:48px"><div class="nm"><b>'+r.n+'</b></div>'+scoreBox(r.v)+'</div>';}).join('')+'</div></div>'+
    '<div><h3>O que os moradores dizem</h3><div style="display:flex;flex-direction:column;gap:8px">'+q.map(function(t){return '<p class="quote">'+esc(t)+'</p>';}).join('')+'</div><p class="tag" style="margin:8px 0 0">Respostas abertas agrupadas por IA. Exemplos ilustrativos.</p></div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:10px"><button type="button" class="btn pri" data-act="newaction" data-svc="'+s.id+'">Registrar ação</button><button type="button" class="btn" data-act="ask" data-v="'+s.id+'">Perguntar à IA</button></div>'+

   '<div class="bd"><div class="stats"><div class="stat"><small>Índice geral</small><b class="tnum">'+f1(c)+'</b></div><div class="stat"><small>Variação</small><b>'+delta(c-cityAt(p))+'</b></div><div class="stat"><small>Posição</small><b class="tnum">'+rankOf(c,cityAvgAt(i))+'º de '+CAPS+'</b></div></div>'+
   '<div><h3>Pontos de atenção</h3><ol style="margin:0;padding-left:20px;font-size:14px">'+worst.map(function(s){return '<li>'+esc(s.nome)+' — '+f1(s.hist[i])+'</li>';}).join('')+'</ol></div>'+

   '<div style="display:flex;flex-wrap:wrap;gap:10px"><button type="button" class="btn pri" data-act="toast" data-v="Na versão real, baixa o PDF pronto para a reunião de secretariado.">Gerar PDF</button><button type="button" class="btn" data-act="close">Fechar</button></div></div></div></div></div>';

function shell(){
  var v=S.view,needsData=v!=='acoes'&&v!=='config';
  var body=(needsData&&MISSING[S.mi])?emptyMonth():{inicio:inicio,servicos:servicos,comparar:comparar,mapa:mapa,acoes:acoes,config:config}[v]();
  var opts=MONTHS.map(function(m,k){return '<option value="'+k+'"'+(k===S.mi?' selected':'')+'>'+m+(MISSING[k]?' · sem dados':'')+'</option>';}).reverse().join('');
  var side=NAV.map(function(n){return '<button type="button" class="'+(v===n[0]?'on':'')+'" data-act="view" data-v="'+n[0]+'" aria-current="'+(v===n[0]?'page':'false')+'">'+IC[n[0]]+n[1]+'</button>';}).join('');
  var bnav=NAV.map(function(n){return '<button type="button" class="'+(v===n[0]?'on':'')+'" data-act="view" data-v="'+n[0]+'" aria-current="'+(v===n[0]?'page':'false')+'">'+IC[n[0]]+'<span>'+n[2]+'</span></button>';}).join('');
  return '<div class="shell"><aside class="side"><div class="logo"><i>'+IC.comparar+'</i><div><b>Painel Municipal</b><span>Inteligência de gestão</span></div></div><nav aria-label="Seções">'+side+'</nav><div class="grow"></div><nav aria-label="Conta"><button type="button" class="'+(v==='config'?'on':'')+'" data-act="view" data-v="config">'+IC.config+'Configurações</button></nav><div class="foot">Protótipo com dados fictícios</div></aside>'+
   '<div class="main"><header class="top"><div class="in"><div class="city"><b>Cidade Exemplo</b><span>Gabinete do prefeito<span class="hide-m"> · <span class="demo">Demo</span></span></span></div>'+
   '<label class="sel"><span style="position:absolute;width:1px;height:1px;overflow:hidden">Mês da pesquisa</span><select data-act="month" aria-label="Mês da pesquisa">'+opts+'</select></label>'+
   '<button type="button" class="btn" data-act="report" aria-label="Relatório do mês">'+IC.doc+'<span class="hide-m">Relatório</span></button>'+
   '<button type="button" class="avatar" data-act="view" data-v="config" aria-label="Conta e configurações">GB</button></div></header>'+
   '<main class="content">'+body+'</main></div></div>'+
   '<nav class="bnav" aria-label="Seções">'+bnav+'</nav>'+
   (S.detail?detail():'')+(S.report?report():'')+(S.form?actionForm():'')+(S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':'');

var tt=null,lastView=null;
function render(focusId){
  var y=window.scrollY;
  app.innerHTML=shell();
  if(lastView!==S.view){window.scrollTo(0,0);lastView=S.view;}else window.scrollTo(0,y);
  if(focusId&&focusId!=='__none'){var el=document.getElementById(focusId);if(el){el.focus();var l=el.value.length;try{el.setSelectionRange(l,l);}catch(e){}}}
  if((S.detail||S.report||S.form)&&!focusId){var x=S.form?document.getElementById(S.form._focus||'f-t'):app.querySelector('.x');if(x)x.focus();if(S.form)S.form._focus=null;}
}
function toast(t){S.toast=t;render();clearTimeout(tt);tt=setTimeout(function(){S.toast='';render();},2600);}

app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  if(el.tagName==='SELECT')return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(a==='close'){if(e.target.closest('[data-stop]')&&el.classList.contains('scrim'))return;if(S.form){S.form=null;}else{S.detail=null;S.report=false;}render();return;}
  if(a==='view'){S.view=v;S.detail=null;}
  else if(a==='month'){S.mi=+v;}
  else if(a==='svc'){S.detail=v;}
  else if(a==='area'){S.area=v;S.view='servicos';S.detail=null;}
  else if(a==='maparea'){S.mapArea=v;}
  else if(a==='clear'){S.q='';S.area='all';S.lvl='all';}
  else if(a==='lvl'){S.lvl=v;}
  else if(a==='group'){S.group=v==='1';}
  else if(a==='tgl'){S.open[v]=!S.open[v];render('__none');var t=app.querySelector('[data-act="tgl"][data-v="'+v+'"]');if(t)t.focus();return;}
  else if(a==='openall'){AREAS.forEach(function(x){S.open[x[0]]=true;});}
  else if(a==='closeall'){S.open={};}
  else if(a==='apvall'){S.apvAll=v==='1';}
  else if(a==='newaction'){var sv=el.getAttribute('data-svc'),rg=el.getAttribute('data-region');var o={};if(sv){var x=SVC.find(function(q){return q.id===sv;});o.area=x.area;o.svc=sv;}if(rg!=null)o.regs=[+rg];S.form=newForm(o);}
  else if(a==='freg'){var k=+v,ix=S.form.regs.indexOf(k);if(ix>=0)S.form.regs.splice(ix,1);else S.form.regs.push(k);delete S.form.err.regs;S.form._focus=null;render('__none');var b=app.querySelector('[data-act="freg"][data-v="'+k+'"]');if(b)b.focus();return;}
  else if(a==='fregall'){S.form.regs=S.form.regs.length===REGIONS.length?[]:REGIONS.map(function(r,k){return k;});delete S.form.err.regs;render('__none');var b2=app.querySelector('[data-act="fregall"]');if(b2)b2.focus();return;}
  else if(a==='fst'){S.form.st=v;render('__none');var b3=app.querySelector('[data-act="fst"][data-v="'+v+'"]');if(b3)b3.focus();return;}
  else if(a==='region'){S.region=+v;}
  else if(a==='mapmode'){S.mapMode=v;}
  else if(a==='report'){S.report=true;}
  else if(a==='toast'){toast(v);return;}
  else if(a==='ask'){toast('Na versão real, abre o assistente já com o contexto deste serviço.');return;}
  render();
});
app.addEventListener('change',function(e){
  var a=e.target.getAttribute('data-act');
  if(a==='month'){S.mi=+e.target.value;render();}
  else if(a==='sort'){S.sort=e.target.value;render();}
  else if(a==='areasel'){S.area=e.target.value;render();}
  var f=e.target.getAttribute('data-f');
  if(f&&S.form){S.form[f]=e.target.value;delete S.form.err[f];if(f==='area'){S.form.svc='';S.form._focus='f-area';render('__none');document.getElementById('f-area').focus();}else if(f==='svc'){render('__none');document.getElementById('f-svc').focus();}}
  else if(a==='mapsel'){S.mapArea=e.target.value;render();}
});
app.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;render('q');return;}var f=e.target.getAttribute('data-f');if(f&&S.form&&e.target.tagName!=='SELECT'){S.form[f]=e.target.value;}});
app.addEventListener('submit',function(e){
  e.preventDefault();if(!S.form)return;var F=S.form,er={};
  if(!F.t.trim())er.t='Dê um nome para a ação.';
  if(!F.area)er.area='Escolha a área.';
  if(!F.svc)er.svc='Escolha o serviço.';
  if(!F.regs.length)er.regs='Escolha ao menos uma região.';
  F.err=er;
  if(Object.keys(er).length){var first={t:'f-t',area:'f-area',svc:'f-svc'}[Object.keys(er)[0]];render('__none');var el=first?document.getElementById(first):app.querySelector('[data-act="freg"]');if(el)el.focus();return;}
  var s=SVC.find(function(x){return x.id===F.svc;}),i=lastWithData(S.mi);
  var regs=F.regs.length===REGIONS.length?'Cidade toda':F.regs.slice().sort().map(function(k){return REGIONS[k];}).join(', ');
  ACTIONS.unshift({t:F.t.trim(),a:F.area,s:F.svc,r:regs,st:F.st,from:s.hist[i],to:null,isNew:true});
  S.form=null;S.detail=null;S.view='acoes';render();toast('Ação registrada. O impacto aparece a partir da próxima pesquisa.');
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&(S.detail||S.report||S.form)){if(S.form)S.form=null;else{S.detail=null;S.report=false;}render();return;}
  var g=e.target.closest&&e.target.closest('g[data-act]');
  if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();var k=g.getAttribute('data-v');S.region=+k;render('__none');var n=app.querySelector('g[data-act="region"][data-v="'+k+'"]');if(n)n.focus();}
});
var mq=window.matchMedia?window.matchMedia('(max-width:599px)'):null;if(mq){var h=function(){render('__none');};if(mq.addEventListener)mq.addEventListener('change',h);else if(mq.addListener)mq.addListener(h);}
render();
})();
</script>
